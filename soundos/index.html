<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundOS Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#ED1C24',
              dark: '#09090b',
              'dark-elevated': '#121215',
              'dark-input': '#18181b',
              'text-primary': '#FFFFFF',
              'text-secondary': '#A1A1AA',
              'text-tertiary': '#71717A'
            }
          }
        }
      }
    }
  </script>
  <style>
    .backdrop-blur-xl { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  </style>
</head>
<body class="bg-brand-dark text-brand-text-primary font-sans h-screen flex flex-col overflow-hidden select-none">

  <!-- Reproductor iFrame de YouTube Oculto -->
  <div class="hidden"><div id="youtube-player"></div></div>

  <div class="flex flex-1 overflow-hidden relative">
    <!-- BARRA LATERAL (Escritorio) -->
    <aside class="w-64 p-6 bg-black flex-col border-r border-zinc-900 flex-shrink-0 hidden md:flex">
      <div class="flex items-center gap-2 mb-8">
        <i data-lucide="music-4" class="w-7 h-7 text-brand-red"></i>
        <h1 class="text-2xl font-black text-brand-red tracking-tight">SOUND<span class="text-white">OS</span></h1>
      </div>
      <nav class="space-y-4">
        <a href="#" onclick="location.reload()" class="flex items-center gap-4 text-brand-red font-semibold">
          <i data-lucide="home" class="w-5 h-5"></i> Inicio
        </a>
        <a href="#" onclick="showFavorites()" class="flex items-center gap-4 text-brand-text-secondary hover:text-white transition">
          <i data-lucide="heart" class="w-5 h-5"></i> Mis Favoritos
        </a>
      </nav>
      <div class="mt-8 space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-brand-text-tertiary uppercase">Mis Playlists</span>
          <button onclick="openCreatePlaylistModal()" class="text-brand-red hover:text-red-400"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
        <div id="sidebar-playlists" class="space-y-2 text-sm text-brand-text-secondary max-h-48 overflow-y-auto"></div>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto pb-44 md:pb-32 w-full">
      <header class="flex items-center gap-2 md:gap-4 mb-6 sticky top-0 bg-brand-dark/95 backdrop-blur-md z-20 py-2">
        <div class="relative flex-1">
          <i data-lucide="search" class="absolute left-3 md:left-4 top-1/2 -translate-y-1/2 w-4 h-4 md:w-5 md:h-5 text-brand-text-secondary"></i>
          <input type="text" id="search-input" placeholder="Buscar artista o canción..." class="w-full pl-9 md:pl-12 pr-4 py-2 text-xs md:text-sm bg-brand-dark-input rounded-full border border-zinc-800 focus:border-brand-red outline-none">
        </div>
        <button id="search-btn" class="bg-brand-red hover:bg-red-600 px-4 md:px-6 py-2 text-xs font-bold rounded-full transition">
          Buscar
        </button>
      </header>

      <div class="flex flex-col lg:flex-row gap-6">
        <div class="flex-1 space-y-6">
          <div>
            <h3 id="section-title" class="text-xs font-bold text-brand-text-tertiary tracking-wider uppercase mb-3">Tendencias Locales</h3>
            <div id="top-songs-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <p class="text-xs text-brand-text-tertiary">Cargando tendencias...</p>
            </div>
          </div>
          <div>
            <h3 class="text-xs font-bold text-brand-text-tertiary tracking-wider uppercase mb-3">Álbumes y Playlists populares</h3>
            <div id="albums-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
          </div>
        </div>

        <!-- Cola de reproducción disponible únicamente en vista escritorio -->
        <div class="hidden lg:block w-72 space-y-4 flex-shrink-0">
          <h3 class="text-base font-bold">Cola de Reproducción</h3>
          <div id="queue-list" class="space-y-2 max-h-96 overflow-y-auto pr-1">
            <p class="text-xs text-brand-text-tertiary">Cola vacía.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- NAVEGACIÓN INFERIOR CELULARES -->
  <div class="md:hidden fixed bottom-20 left-0 right-0 bg-zinc-950 border-t border-zinc-900 flex justify-around py-2 z-40 text-[10px] text-brand-text-secondary">
    <button onclick="location.reload()" class="flex flex-col items-center gap-1 text-brand-red"><i data-lucide="home" class="w-4 h-4"></i> Inicio</button>
    <button onclick="showFavorites()" class="flex flex-col items-center gap-1"><i data-lucide="heart" class="w-4 h-4"></i> Favoritos</button>
    <button onclick="openCreatePlaylistModal()" class="flex flex-col items-center gap-1"><i data-lucide="plus-circle" class="w-4 h-4"></i> Crear Playlist</button>
  </div>

  <!-- BARRA DE REPRODUCCIÓN INFERIOR -->
  <footer class="fixed bottom-0 left-0 right-0 h-20 md:h-24 bg-zinc-950 px-3 md:px-6 py-2 border-t border-zinc-900 flex flex-col justify-between z-50">
    <div class="flex items-center justify-between gap-2 md:gap-4">
      <div class="flex items-center gap-2 md:gap-3 w-1/3 min-w-0 cursor-pointer group" onclick="openFullscreenPlayer()">
        <div class="relative">
          <img id="current-thumb" src="https://via.placeholder.com/40" class="w-9 h-9 md:w-12 md:h-12 rounded object-cover bg-zinc-900 flex-shrink-0 group-hover:opacity-80 transition">
          <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i data-lucide="maximize-2" class="w-4 h-4 text-white"></i></div>
        </div>
        <div class="truncate">
          <h4 id="current-title" class="text-xs md:text-sm font-bold truncate">Selecciona una pista</h4>
          <p id="current-artist" class="text-[10px] md:text-xs text-brand-text-secondary truncate">SoundOS</p>
        </div>
      </div>

      <div class="flex flex-col items-center gap-1 w-2/4 max-w-md">
        <div class="flex items-center gap-4 md:gap-6">
          <button id="prev-btn" class="text-brand-text-secondary hover:text-white"><i data-lucide="skip-back" class="w-4 h-4 md:w-5 md:h-5"></i></button>
          <button id="play-btn" class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-brand-red text-white flex items-center justify-center">
            <i id="play-icon" data-lucide="play" class="w-4 h-4 md:w-5 md:h-5 fill-white"></i>
          </button>
          <button id="next-btn" class="text-brand-text-secondary hover:text-white"><i data-lucide="skip-forward" class="w-4 h-4 md:w-5 md:h-5"></i></button>
        </div>
        <div class="flex items-center gap-2 w-full text-[10px] md:text-xs text-brand-text-secondary">
          <span id="current-time">0:00</span>
          <input type="range" id="progress-bar" value="0" min="0" max="100" class="flex-1 accent-brand-red h-1 bg-zinc-800 rounded">
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <div class="hidden sm:flex items-center justify-end gap-2 w-1/4 text-xs text-brand-text-secondary">
        <i data-lucide="volume-2" class="w-4 h-4"></i>
        <input type="range" id="volume-bar" value="100" min="0" max="100" class="w-16 md:w-20 accent-brand-red h-1 bg-zinc-800 rounded">
      </div>
    </div>
  </footer>

  <!-- REPRODUCTOR PANTALLA COMPLETA EN MÓVIL (DEEZER STYLE CON AMBOS BOTONES) -->
  <div id="fullscreen-player" class="fixed inset-0 bg-black/95 z-[200] hidden flex-col justify-between p-6 backdrop-blur-xl transition-all duration-300">
    <div class="flex items-center justify-between">
      <button onclick="closeFullscreenPlayer()" class="p-2 text-zinc-400 hover:text-white"><i data-lucide="chevron-down" class="w-8 h-8"></i></button>
      <span class="text-xs font-bold uppercase text-brand-text-tertiary">Reproduciendo ahora</span>
      <div class="w-8"></div>
    </div>

    <div class="flex flex-col items-center justify-center my-auto w-full max-w-sm mx-auto">
      <img id="fs-thumb" src="https://via.placeholder.com/300" class="w-64 h-64 md:w-80 md:h-80 rounded-2xl shadow-2xl object-cover mb-6 border border-zinc-800">
      
      <!-- Titulo y botones directos (+ y Favorito) a los lados -->
      <div class="flex items-center justify-between w-full mb-6 px-2">
        <button onclick="toggleFavCurrent()" class="p-2 text-zinc-400 hover:text-brand-red">
          <i id="fs-fav-icon" data-lucide="heart" class="w-6 h-6"></i>
        </button>
        <div class="text-center truncate px-2 flex-1">
          <h3 id="fs-title" class="text-lg md:text-xl font-black truncate w-full">Título</h3>
          <p id="fs-artist" class="text-sm text-brand-text-secondary truncate w-full">Artista</p>
        </div>
        <button onclick="addCurrentToPlaylistPrompt()" class="p-2 text-zinc-400 hover:text-white">
          <i data-lucide="plus" class="w-6 h-6"></i>
        </button>
      </div>

      <div class="w-full space-y-2 mb-6">
        <input type="range" id="fs-progress-bar" value="0" min="0" max="100" class="w-full accent-brand-red h-1.5 bg-zinc-800 rounded">
        <div class="flex justify-between text-xs text-brand-text-tertiary">
          <span id="fs-current-time">0:00</span>
          <span id="fs-total-duration">0:00</span>
        </div>
      </div>

      <div class="flex items-center justify-center gap-8">
        <button id="fs-prev-btn" class="text-white hover:text-brand-red transition"><i data-lucide="skip-back" class="w-8 h-8"></i></button>
        <button id="fs-play-btn" class="w-16 h-16 rounded-full bg-brand-red text-white flex items-center justify-center hover:scale-105 active:scale-95 transition">
          <i id="fs-play-icon" data-lucide="play" class="w-8 h-8 fill-white"></i>
        </button>
        <button id="fs-next-btn" class="text-white hover:text-brand-red transition"><i data-lucide="skip-forward" class="w-8 h-8"></i></button>
      </div>
    </div>
  </div>

  <!-- MODAL CREAR PLAYLIST -->
  <div id="playlist-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[250] p-4">
    <div class="bg-brand-dark-elevated p-6 rounded-2xl border border-zinc-800 w-full max-w-sm">
      <h3 class="text-lg font-bold mb-4">Nueva Playlist</h3>
      <input type="text" id="playlist-name-input" placeholder="Nombre de la playlist..." class="w-full p-2.5 bg-brand-dark-input rounded-lg border border-zinc-800 outline-none text-sm mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="closeCreatePlaylistModal()" class="px-4 py-2 text-xs font-bold text-brand-text-secondary">Cancelar</button>
        <button onclick="saveNewPlaylist()" class="px-4 py-2 bg-brand-red text-xs font-bold rounded-lg">Crear</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const YOUTUBE_API_KEY = "AIzaSyDmdwQXMXx3yi8h48KYOgLiY1l86Qm5Ick";

    let player, queue = [], currentIndex = 0, isPlaying = false, progressTimer = null;
    let favorites = JSON.parse(localStorage.getItem('soundos_favs')) || [];
    let customPlaylists = JSON.parse(localStorage.getItem('soundos_playlists')) || {};

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '0', width: '0',
        playerVars: { 
          'autoplay': 1, 
          'controls': 0, 
          'playsinline': 1 
        },
        events: { 
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange 
        }
      });
      renderSidebarPlaylists();
    }

    function onPlayerReady() {
      setupMediaSession();
      loadLocalTrends();
    }

    // SOPORTE PARA REPRODUCCIÓN EN SEGUNDO PLANO Y PANTALLA DE BLOQUEO
    function setupMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => { player.playVideo(); });
        navigator.mediaSession.setActionHandler('pause', () => { player.pauseVideo(); });
        navigator.mediaSession.setActionHandler('previoustrack', () => { document.getElementById('prev-btn').click(); });
        navigator.mediaSession.setActionHandler('nexttrack', () => { handleNextSong(); });
      }
    }

    function updateMediaSessionMetadata(track) {
      if ('mediaSession' in navigator && track) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          artwork: [{ src: track.thumb, sizes: '512x512', type: 'image/jpeg' }]
        });
      }
    }

    function onPlayerStateChange(e) {
      if (e.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayIcons(true);
        startProgressLoop();
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
      } else {
        isPlaying = false;
        updatePlayIcons(false);
        stopProgressLoop();
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
      }

      if (e.data == YT.PlayerState.ENDED) {
        handleNextSong();
      }
    }

    function updatePlayIcons(playing) {
      const icon = playing ? 'pause' : 'play';
      document.getElementById('play-icon').setAttribute('data-lucide', icon);
      document.getElementById('fs-play-icon').setAttribute('data-lucide', icon);
      lucide.createIcons();
    }

    // TENDENCIAS LOCALES SEGÚN REGIONALIZACIÓN
    async function loadLocalTrends() {
      document.getElementById('section-title').textContent = "Tendencias Locales";
      // Búsqueda orientada a éxitos locales/regionales
      searchYouTube('top musica py paraguay Exitos');
    }

    // SIGUIENTE CANCIÓN CORRELATIVA AUTOMÁTICA
    async function handleNextSong() {
      if (currentIndex < queue.length - 1) {
        currentIndex++;
        loadTrack(queue[currentIndex]);
        updateQueueUI();
      } else if (queue[currentIndex]) {
        const currentArtist = queue[currentIndex].artist;
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${encodeURIComponent(currentArtist + ' canciones')}&type=video&videoCategoryId=10&key=${YOUTUBE_API_KEY}`);
        const data = await res.json();
        
        if (data.items && data.items.length) {
          const nextSongs = data.items.map(item => ({
            id: item.id.videoId,
            title: item.snippet.title.replace(/'/g, ""),
            artist: item.snippet.channelTitle.replace(/'/g, ""),
            thumb: item.snippet.thumbnails.high.url
          }));
          queue.push(...nextSongs);
          currentIndex++;
          loadTrack(queue[currentIndex]);
          updateQueueUI();
        }
      }
    }

    // CONTROLES PANTALLA COMPLETA Y FUNCIONALIDAD DE BOTONES (+ Y FAVORITOS)
    function openFullscreenPlayer() {
      if (!queue.length) return;
      document.getElementById('fullscreen-player').classList.remove('hidden');
      document.getElementById('fullscreen-player').classList.add('flex');
    }

    function closeFullscreenPlayer() {
      document.getElementById('fullscreen-player').classList.add('hidden');
      document.getElementById('fullscreen-player').classList.remove('flex');
    }

    function toggleFavCurrent() {
      if (!queue[currentIndex]) return;
      const track = queue[currentIndex];
      toggleFavorite(track.id, track.title, track.artist, track.thumb);
      updateFsFavIcon();
    }

    function addCurrentToPlaylistPrompt() {
      if (!queue[currentIndex]) return;
      const track = queue[currentIndex];
      addToPlaylistPrompt(track.id, track.title, track.artist, track.thumb);
    }

    function updateFsFavIcon() {
      if (!queue[currentIndex]) return;
      const isFav = favorites.some(f => f.id === queue[currentIndex].id);
      const icon = document.getElementById('fs-fav-icon');
      if (isFav) icon.classList.add('fill-brand-red', 'text-brand-red');
      else icon.classList.remove('fill-brand-red', 'text-brand-red');
    }

    // BÚSQUEDA Y RENDERIZADO
    async function searchYouTube(query) {
      if (!query) return;
      const tracksUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=6&q=${encodeURIComponent(query)}&type=video&videoCategoryId=10&key=${YOUTUBE_API_KEY}`;
      const albumsUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=4&q=${encodeURIComponent(query + ' album')}&type=playlist&key=${YOUTUBE_API_KEY}`;

      try {
        const [resT, resA] = await Promise.all([fetch(tracksUrl), fetch(albumsUrl)]);
        const dataT = await resT.json();
        const dataA = await resA.json();

        if (dataT.items) renderSongs(dataT.items.map(item => ({
          id: item.id.videoId,
          title: item.snippet.title.replace(/'/g, ""),
          artist: item.snippet.channelTitle.replace(/'/g, ""),
          thumb: item.snippet.thumbnails.high.url
        })));

        if (dataA.items) renderAlbums(dataA.items);
      } catch (err) { console.error(err); }
    }

    function renderSongs(songs) {
      const grid = document.getElementById('top-songs-grid');
      grid.innerHTML = songs.map(song => {
        const isFav = favorites.some(f => f.id === song.id);
        return `
          <div class="bg-brand-dark-elevated p-2.5 rounded-xl flex items-center justify-between border border-zinc-900">
            <div class="flex items-center gap-2.5 truncate">
              <img src="${song.thumb}" class="w-10 h-10 rounded object-cover flex-shrink-0">
              <div class="truncate">
                <p class="font-bold text-xs truncate">${song.title}</p>
                <p class="text-[10px] text-brand-text-secondary truncate">${song.artist}</p>
              </div>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="toggleFavorite('${song.id}', '${song.title}', '${song.artist}', '${song.thumb}')" class="p-1.5 hover:text-brand-red">
                <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-brand-red text-brand-red' : 'text-zinc-500'}"></i>
              </button>
              <button onclick="playDirectly('${song.id}', '${song.title}', '${song.artist}', '${song.thumb}')" class="bg-brand-red text-white text-[10px] font-bold p-1.5 rounded-full">
                <i data-lucide="play" class="w-3 h-3 fill-white"></i>
              </button>
              <button onclick="addToPlaylistPrompt('${song.id}', '${song.title}', '${song.artist}', '${song.thumb}')" class="p-1.5 text-zinc-500 hover:text-white">
                <i data-lucide="plus" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function renderAlbums(playlists) {
      const grid = document.getElementById('albums-grid');
      grid.innerHTML = playlists.map(pl => `
        <div class="bg-brand-dark-elevated p-2.5 rounded-xl border border-zinc-900">
          <img src="${pl.snippet.thumbnails.high.url}" class="w-full h-24 object-cover rounded mb-2">
          <p class="font-bold text-xs truncate">${pl.snippet.title}</p>
          <button onclick="searchYouTube('${pl.snippet.title.replace(/'/g, "")}')" class="w-full mt-2 bg-zinc-800 text-[10px] font-bold py-1 rounded">
            Explorar
          </button>
        </div>
      `).join('');
    }

    // FAVORITOS Y PLAYLISTS
    function toggleFavorite(id, title, artist, thumb) {
      const index = favorites.findIndex(f => f.id === id);
      if (index >= 0) favorites.splice(index, 1);
      else favorites.push({ id, title, artist, thumb });
      localStorage.setItem('soundos_favs', JSON.stringify(favorites));
    }

    function showFavorites() {
      document.getElementById('section-title').textContent = "Mis Favoritos";
      renderSongs(favorites);
    }

    function openCreatePlaylistModal() {
      document.getElementById('playlist-modal').classList.remove('hidden');
      document.getElementById('playlist-modal').classList.add('flex');
    }

    function closeCreatePlaylistModal() {
      document.getElementById('playlist-modal').classList.add('hidden');
      document.getElementById('playlist-modal').classList.remove('flex');
    }

    function saveNewPlaylist() {
      const name = document.getElementById('playlist-name-input').value.trim();
      if (name && !customPlaylists[name]) {
        customPlaylists[name] = [];
        localStorage.setItem('soundos_playlists', JSON.stringify(customPlaylists));
        renderSidebarPlaylists();
        closeCreatePlaylistModal();
      }
    }

    function addToPlaylistPrompt(id, title, artist, thumb) {
      const names = Object.keys(customPlaylists);
      if (!names.length) return alert("Crea primero una playlist desde el menú.");
      const selected = prompt(`Elige playlist:\n${names.join('\n')}`);
      if (selected && customPlaylists[selected]) {
        customPlaylists[selected].push({ id, title, artist, thumb });
        localStorage.setItem('soundos_playlists', JSON.stringify(customPlaylists));
        renderSidebarPlaylists();
      }
    }

    function renderSidebarPlaylists() {
      const box = document.getElementById('sidebar-playlists');
      box.innerHTML = Object.keys(customPlaylists).map(name => `
        <div onclick="showPlaylist('${name}')" class="cursor-pointer hover:text-white truncate flex items-center justify-between">
          <span>🎵 ${name}</span>
          <span class="text-[10px] text-zinc-600">(${customPlaylists[name].length})</span>
        </div>
      `).join('');
    }

    function showPlaylist(name) {
      document.getElementById('section-title').textContent = `Playlist: ${name}`;
      renderSongs(customPlaylists[name] || []);
    }

    // REPRODUCCIÓN
    function playDirectly(id, title, artist, thumb) {
      queue.unshift({ id, title, artist, thumb });
      currentIndex = 0;
      updateQueueUI();
      loadTrack(queue[0]);
    }

    function loadTrack(track) {
      if (!player || !track) return;
      player.loadVideoById(track.id);
      
      document.getElementById('current-title').textContent = track.title;
      document.getElementById('current-artist').textContent = track.artist;
      document.getElementById('current-thumb').src = track.thumb;

      document.getElementById('fs-title').textContent = track.title;
      document.getElementById('fs-artist').textContent = track.artist;
      document.getElementById('fs-thumb').src = track.thumb;

      updateFsFavIcon();
      updateMediaSessionMetadata(track);
    }

    function startProgressLoop() {
      stopProgressLoop();
      progressTimer = setInterval(() => {
        if (player && player.getCurrentTime) {
          const c = player.getCurrentTime() || 0, t = player.getDuration() || 0;
          const timeStr = formatTime(c), durationStr = formatTime(t);

          document.getElementById('current-time').textContent = timeStr;
          document.getElementById('total-duration').textContent = durationStr;
          document.getElementById('fs-current-time').textContent = timeStr;
          document.getElementById('fs-total-duration').textContent = durationStr;

          if (t > 0) {
            const val = (c / t) * 100;
            document.getElementById('progress-bar').value = val;
            document.getElementById('fs-progress-bar').value = val;
          }
        }
      }, 1000);
    }

    function stopProgressLoop() { if (progressTimer) clearInterval(progressTimer); }
    function formatTime(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }

    // BINDINGS CONTROLES
    const syncSeek = (e) => { if (player && player.getDuration) player.seekTo((e.target.value / 100) * player.getDuration(), true); };
    document.getElementById('progress-bar').oninput = syncSeek;
    document.getElementById('fs-progress-bar').oninput = syncSeek;

    const togglePlay = () => { if (queue.length) isPlaying ? player.pauseVideo() : player.playVideo(); };
    document.getElementById('play-btn').onclick = togglePlay;
    document.getElementById('fs-play-btn').onclick = togglePlay;

    document.getElementById('prev-btn').onclick = () => { if (currentIndex > 0) { currentIndex--; loadTrack(queue[currentIndex]); updateQueueUI(); } };
    document.getElementById('fs-prev-btn').onclick = () => document.getElementById('prev-btn').click();

    document.getElementById('next-btn').onclick = handleNextSong;
    document.getElementById('fs-next-btn').onclick = handleNextSong;

    document.getElementById('volume-bar').oninput = (e) => { if (player && player.setVolume) player.setVolume(e.target.value); };
    document.getElementById('search-btn').onclick = () => {
      const q = document.getElementById('search-input').value.trim();
      if(q) {
        document.getElementById('section-title').textContent = "Resultados de búsqueda";
        searchYouTube(q);
      }
    };
    document.getElementById('search-input').onkeypress = (e) => { if (e.key === 'Enter') document.getElementById('search-btn').click(); };

    function updateQueueUI() {
      const box = document.getElementById('queue-list');
      if(!box) return;
      box.innerHTML = queue.map((song, i) => `
        <div onclick="currentIndex=${i}; loadTrack(queue[${i}]); updateQueueUI();" class="p-2 rounded border ${i === currentIndex ? 'bg-brand-red/10 border-brand-red' : 'bg-brand-dark-elevated border-zinc-900'} flex items-center gap-2 cursor-pointer">
          <img src="${song.thumb}" class="w-7 h-7 rounded object-cover">
          <p class="text-xs font-bold truncate ${i === currentIndex ? 'text-brand-red' : 'text-white'}">${song.title}</p>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
